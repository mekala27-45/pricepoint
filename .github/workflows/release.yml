name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "0.11.33"
          python-version: "3.12.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run mypy packages
      - run: uv run pytest --cov
      - run: uv run python scripts/check_no_em_dash.py
      - run: uv run pricepoint check
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /pricepoint
      - run: uv build --all-packages
      - run: tar -czf dist/pricepoint-demo.tar.gz -C web/out .
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "pricepoint $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
