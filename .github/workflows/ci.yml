name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  POLARS_MAX_THREADS: "4"
  OMP_NUM_THREADS: "1"

jobs:
  lint:
    name: Python lint, types, and text policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_no_em_dash.py

  test:
    name: Behavioral and property tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Require external test dependencies
        run: |
          command -v git
          command -v node
          git --version
          node --version
      - run: uv sync --locked --all-packages --all-groups
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  evidence:
    name: Published claims and artifact integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-groups
      - run: uv run python scripts/check_published_numbers.py
      - run: uv run python scripts/verify_artifacts.py

  skew:
    name: Real-data training and serving agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-groups
      - name: Recompute real panel evidence and break the serving rounding rule
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from pricepoint_data.verification import verify_panel
          measured = verify_panel("artifacts/serving_panel.parquet", ".cache/ci-evidence")
          assert measured["skew"]["pairs"] == 500
          assert measured["leakage"]["pairs"] == 200
          assert measured["skew"]["passed"]
          assert measured["leakage"]["passed"]
          assert measured["skew"]["deliberate_corruption_detected"]
          for name, result in measured.items():
              stored = json.loads(Path(f"artifacts/{name}.json").read_text())
              assert result["panel_sha256"] == stored["panel_sha256"]
              assert result["feature_names"] == stored["feature_names"]
          print(json.dumps(measured, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recomputed-feature-evidence
          path: .cache/ci-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error

  container:
    name: Container startup and measured HTTP load
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-groups
      - name: Resolve exact patch images and record their identities
        run: |
          docker info
          docker pull python:3.12.14-slim-bookworm
          docker pull ghcr.io/astral-sh/uv:0.11.33
          mkdir -p .cache/container
          docker image inspect python:3.12.14-slim-bookworm ghcr.io/astral-sh/uv:0.11.33 > .cache/container/base-images.json
      - name: Build application image
        run: |
          docker build --pull -f packages/serve/Dockerfile -t pricepoint .
          docker image inspect pricepoint > .cache/container/application-image.json
      - name: Start service and require healthy artifact loading
        run: |
          docker run --detach --name pricepoint-ci --publish 8000:8000 pricepoint
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs pricepoint-ci
          exit 1
      - name: Measure HTTP latency and throughput
        run: uv run python scripts/loadtest.py --url http://127.0.0.1:8000 --container --seconds 30 --concurrency 4 --output artifacts/loadtest-container.json
      - name: Collect container logs
        if: always()
        run: docker logs pricepoint-ci > .cache/container/service.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: container-latency-and-image-evidence
          path: |
            artifacts/loadtest-container.json
            .cache/container/
          include-hidden-files: true
          if-no-files-found: error
      - name: Stop service
        if: always()
        run: docker rm --force pricepoint-ci || true

  web:
    name: Web tests and static export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_BASE_PATH: /pricepoint
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-demo
          path: web/out
          if-no-files-found: error
