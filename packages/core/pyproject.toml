[project]
name = "pricepoint-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11", "numpy>=2", "typer>=0.16", "rich>=13.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepoint_core"]

