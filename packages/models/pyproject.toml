[project]
name = "pricepoint-models"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pricepoint-core", "pricepoint-data", "statsmodels>=0.14.4", "lightgbm>=4.6", "scikit-learn>=1.6", "scipy>=1.15", "duckdb>=1.3", "joblib>=1.4", "pyarrow>=20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepoint_models"]


