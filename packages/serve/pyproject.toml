[project]
name = "pricepoint-serve"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pricepoint-core", "pricepoint-data", "pricepoint-models", "fastapi>=0.115", "uvicorn>=0.34", "structlog>=25", "prometheus-client>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepoint_serve"]

