[project]
name = "pricepoint-monitor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pricepoint-core", "scipy>=1.15", "polars>=1.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepoint_monitor"]

